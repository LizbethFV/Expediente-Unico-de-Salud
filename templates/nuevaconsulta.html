<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva Consulta - EUS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#f0f7ff] p-6">
    <div class="max-w-4xl mx-auto bg-white rounded-3xl shadow-xl p-8 border border-gray-100">
        
        <div class="flex justify-between items-center mb-8 pb-4 border-b">
            <div>
                <h1 class="text-3xl font-black text-[#242552]">NUEVA CONSULTA</h1>
                <p class="text-blue-600 font-bold uppercase tracking-widest text-sm">Paciente: {{ paciente.nombre }}</p>
            </div>
            <div class="text-right">
                <span class="text-gray-400 text-xs block uppercase font-bold">CURP</span>
                <span class="font-mono text-sm">{{ paciente.curp }}</span>
            </div>
        </div>

        <form action="/guardar_consulta/{{ paciente.curp }}" method="POST" class="space-y-6">
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 bg-blue-50 p-6 rounded-2xl">
                <div>
                    <label class="block text-[10px] font-black text-blue-900 mb-1">PESO (kg)</label>
                    <input type="text" name="peso" placeholder="0.0" class="w-full p-2 rounded-lg border-none focus:ring-2 focus:ring-blue-400">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-blue-900 mb-1">TALLA (cm)</label>
                    <input type="text" name="talla" placeholder="0" class="w-full p-2 rounded-lg border-none focus:ring-2 focus:ring-blue-400">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-blue-900 mb-1">TEMP (°C)</label>
                    <input type="text" name="temp" placeholder="36.5" class="w-full p-2 rounded-lg border-none focus:ring-2 focus:ring-blue-400">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-blue-900 mb-1">P. ARTERIAL</label>
                    <input type="text" name="presion" placeholder="120/80" class="w-full p-2 rounded-lg border-none focus:ring-2 focus:ring-blue-400">
                </div>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-black text-gray-500 mb-2 uppercase">Motivo de la Consulta</label>
                    <textarea name="motivo" rows="2" class="w-full p-4 bg-gray-50 rounded-xl border-none focus:ring-2 focus:ring-blue-400"></textarea>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-black text-gray-500 mb-2 uppercase">Diagnóstico</label>
                        <textarea name="diagnostico" rows="3" class="w-full p-4 bg-gray-50 rounded-xl border-none focus:ring-2 focus:ring-blue-400"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-black text-gray-500 mb-2 uppercase">Tratamiento / Receta</label>
                        <textarea name="tratamiento" rows="3" class="w-full p-4 bg-gray-50 rounded-xl border-none focus:ring-2 focus:ring-blue-400"></textarea>
                    </div>
                </div>
            </div>

            <div class="flex justify-end space-x-4 pt-6">
                <a href="/dashboard" class="px-6 py-3 text-gray-400 font-bold hover:text-gray-600 transition">Cancelar</a>
                <button type="submit" class="bg-[#242552] text-white px-10 py-3 rounded-xl font-black shadow-lg hover:scale-105 transition-transform">
                    Finalizar y Generar Receta
                </button>
            </div>
        </form>
    </div>
</body>
</html>
