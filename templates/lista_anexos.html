<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Anexos Especializados - EUS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="min-h-screen font-sans">
    <nav class="bg-[#f0f7ff] p-4 flex justify-between items-center shadow-md mb-8 px-12">
        <!-- Contenedor del Logo -->
        <div class="flex items-center ml-4">
            <a href="/dashboard">
                <img src="/static/img/logoeuscolor.png" class="w-17 h-14" alt="Logo EUS">
            </a>
        </div>

        <!-- Menú empujado a la derecha -->
        <div class="flex space-x-8 text-blue-950 font-bold text-[20px] items-center ml-auto mr-12">
            <a href="/agenda" class="hover:text-blue-500 transition">Agenda</a>
            <a href="/pacientes" class="hover:text-blue-500 transition">Pacientes</a>
            <a href="#" class="hover:text-blue-500 transition">Consultas</a>
        </div>

        <!-- Perfil del Doctor -->
        <div class="flex items-center space-x-3 mr-6">
            <div class="text-right">
                <p class="text-[10px] font-bold text-gray-400 uppercase leading-none">Bienvenido</p>
                <p class="text-sm font-black text-blue-950">Dr. Médico</p>
            </div>
            <div class="bg-blue-100 p-2 rounded-full shadow-sm">
                <i class="fas fa-user-md text-blue-600 text-xl"></i>
            </div>
        </div>
    </nav>
    <div class="max-w-5xl mx-auto">
        <div class="flex items-center justify-between mb-8">
            <div>
                <a href="{{ url_for('perfil_paciente', curp=paciente.curp) }}"
                    class="text-blue-950 text-xs font-bold uppercase hover:underline">
                    <i class="fas fa-arrow-left mr-2"></i> Volver al Perfil
                </a>
                <h1 class="text-2xl font-bold text-[#242552] mt-2 uppercase tracking-tight">Anexos de Especialidad</h1>
                <p class="text-gray-400 text-sm font-bold uppercase tracking-widest">Paciente: {{ paciente.nombre }}</p>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

            <a href="/paciente/{{ paciente.curp }}/anexo/neurologia"
                class="bg-white border border-gray-200 p-8 rounded-md hover:border-blue-950 hover:shadow-xl transition group">

                <div class="flex justify-between items-start mb-6">
                    <div
                        class="bg-blue-50 p-4 rounded-md text-blue-600 group-hover:bg-[#242552] group-hover:text-white transition">
                        <i class="fas fa-brain text-2xl"></i>
                    </div>
                    <i class="fas fa-external-link-alt text-gray-200 group-hover:text-blue-500 transition"></i>
                </div>

                <h3 class="text-[#242552] font-black text-lg uppercase">Neurología</h3>
                <p class="text-gray-400 text-[10px] font-bold mt-2 uppercase tracking-wider">Protocolo estandarizado
                    NOM-024</p>

                <div
                    class="mt-6 pt-6 border-t border-gray-50 flex items-center text-[10px] font-black text-gray-300 uppercase tracking-widest group-hover:text-blue-500 transition">
                    <span>Ver Expediente</span>
                    <i class="fas fa-arrow-right ml-2 group-hover:translate-x-2 transition-transform"></i>
                </div>
            </a>

            <div
                class="border-2 border-dashed border-gray-100 rounded-md flex flex-col items-center justify-center p-8 bg-gray-50/50">
                <i class="fas fa-lock text-gray-200 text-xl mb-2"></i>
                <p class="text-[9px] font-black text-gray-300 uppercase tracking-tighter text-center">
                    Próximas especialidades<br>en desarrollo
                </p>
            </div>

        </div>
    </div>
</body>

</html>
